<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="OpenSoba">
  <title>OpenSoba</title>
  <!-- Full-bleed background so it looks right when GitHub circle-crops the avatar -->
  <rect width="256" height="256" fill="#22304A"/>
  <g transform="translate(0,-10) scale(4)">
    <!-- Service mesh: nodes connected by links, rising like steam / noodles -->
