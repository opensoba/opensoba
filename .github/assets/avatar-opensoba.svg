      <path d="M22 26 L32 14 L42 26"/>
      <path d="M32 14 L32 26"/>
      <path d="M22 26 L42 26"/>
    </g>
    <g fill="#7FD1BE">
      <circle cx="32" cy="14" r="4.2"/>
      <circle cx="22" cy="26" r="3.6"/>
      <circle cx="42" cy="26" r="3.6"/>
    </g>
    <!-- Ramen bowl -->
    <path d="M9 32 A23 23 0 0 0 55 32 Z" fill="#F2871F"/>
    <rect x="6" y="29" width="52" height="6" rx="3" fill="#FFC266"/>
  </g>
</svg>
